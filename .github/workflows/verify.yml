name: verify

# The repository historically shipped no CI, so every pull request reached the
# merge gate with zero successful checks. The managed delivery lane reads
# "no successful check" as a repairable defect and opens a repair issue per PR,
# which cannot fix a repository-wide gap: the repair burns, the PR waits, and the
# next PR conflicts with it. This workflow is the missing check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: provenance claims
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The guard compares docs/PROVENANCE.inventory.json with `git ls-files`, so it needs a
          # real checkout with tracked files, not an archive.
          fetch-depth: 1

      # docs/PROVENANCE.md is the declared source of truth for what ships and what does not.
      # Without this step the inventory can drift from the tree on the next layer addition.
      - name: Test-UETemplateProvenance.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UETemplateProvenance.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UETemplateProvenance.ps1 exited $LASTEXITCODE" }

      - name: Test-UETemplateProvenance.Tests.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UETemplateProvenance.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UETemplateProvenance.Tests.ps1 exited $LASTEXITCODE" }

  scaffold:
    name: scaffold generator
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The generator records the template commit and refuses a dirty tree.
          # The suite builds its own fixtures and clones itself from this checkout.
          fetch-depth: 1

      - name: Test-UETemplateScaffold.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UETemplateScaffold.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UETemplateScaffold.ps1 exited $LASTEXITCODE" }

      # The credits audit decides whether a delivery record explains the Content/ that is
      # actually shipped. Its regression suite needs no engine and no GPU; running it here
      # keeps the false-PASS path (0 assets seen from the delivery directory) from coming back.
      - name: Test-UECreditsInventory.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UECreditsInventory.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UECreditsInventory.ps1 exited $LASTEXITCODE" }

      - name: Integration review regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UEIntegrationReview.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UEIntegrationReview.ps1 exited $LASTEXITCODE" }

  lease:
    name: lease protocol
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Test-UETemplateLease.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UETemplateLease.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UETemplateLease.ps1 exited $LASTEXITCODE" }
          ./scripts/Test-UETemplateProcessOwnership.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UETemplateProcessOwnership.ps1 exited $LASTEXITCODE" }

      # The player-count gate reads the online plugin's C++ as text and refuses the shape that lost
      # the leave decrement. Its own negative cases are run separately so a gate that silently stops
      # matching fails here instead of passing forever.
      - name: Test-MulticaOnlinePlayerCountContract.Tests.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-MulticaOnlinePlayerCountContract.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-MulticaOnlinePlayerCountContract.Tests.ps1 exited $LASTEXITCODE" }

  docs-route:
    name: change log route and headings
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The gate resolves a heading's 40-hex SHA with `git cat-file -e`, so a
          # depth-1 clone would fail every section that names a commit. The gate
          # therefore requires a date on every heading and checks a SHA only when
          # one is written; depth stays 1 to keep the job cheap. The negative
          # cases clone this checkout locally, which git refuses to hardlink from
          # a shallow repository but still completes (verified locally).
          fetch-depth: 1

      - name: Test-UETemplateDocs.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UETemplateDocs.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UETemplateDocs.ps1 exited $LASTEXITCODE" }

  render-artifacts:
    name: render artifact inspection
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      # The clean-sequence case asserts decode=pass, which needs a real decoder.
      # Without one the inspector correctly reports decode=unverified and exits 2,
      # so the suite is capability-dependent, not runner-independent. The decoder is
      # therefore fixed by scripts/ffprobe-pin.json (source URL, archive sha256,
      # ffprobe sha256, version) instead of being taken from the runner image or an
      # unversioned package install: a different ffprobe ahead on PATH used to change
      # the verdict with no change to this repository.
      - name: Provide pinned ffprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveCache = Join-Path $env:RUNNER_TEMP 'ffprobe-pin-archive.zip'
          # The script throws on any pin mismatch, so no exit-code check is needed here ($LASTEXITCODE
          # is not set by a PowerShell script call).
          $decoderPath = ./scripts/Install-PinnedFfprobe.ps1 -ArchiveCachePath $archiveCache
          if (-not (Test-Path -LiteralPath $decoderPath -PathType Leaf)) { throw "the pinned decoder was not installed: $decoderPath" }
          "FFPROBE_HOME=$(Split-Path -Parent $decoderPath)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FFPROBE_PIN_ARCHIVE=$archiveCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The pinned directory goes first so the suite's own PATH lookup resolves it. A decoder
          # left earlier on PATH by the runner image is not removed; Test-FfprobePin.ps1 covers
          # that case explicitly in the next step.
          "$(Split-Path -Parent $decoderPath)" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Test-FfprobePin.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Throws on the first pin violation, so a non-pinned decoder fails the job.
          ./scripts/Test-FfprobePin.ps1 -ArchivePath $env:FFPROBE_PIN_ARCHIVE

      - name: ffprobe version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resolved = (Get-Command ffprobe -ErrorAction Stop).Source
          Write-Host "decoder: $resolved"
          Write-Host "decoder sha256: $((Get-FileHash -LiteralPath $resolved -Algorithm SHA256).Hash.ToLowerInvariant())"
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "ffprobe -version exited $LASTEXITCODE" }

      - name: Confirm the PATH decoder is the pinned ffprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The suite resolves its decoder through PATH. Assert that lookup returns the pinned bytes
          # and version before the assertions run, so a decoder earlier on PATH fails the job here
          # instead of silently changing the decode verdict.
          . ./scripts/FfprobePin.ps1
          $pin = Read-FfprobePin ./scripts/ffprobe-pin.json
          $resolved = (Get-Command ffprobe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $violations = @(Get-FfprobePinViolations -Path $resolved -ExpectedSha256 $pin.ffprobe.sha256 -VersionLinePrefix $pin.ffprobe.version_line_prefix)
          if ($violations.Count -gt 0) { throw "the resolved decoder is not the pinned one: $($violations -join '; ')" }
          Write-Host "pinned decoder confirmed: $resolved"

      - name: Test-UERenderArtifacts.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "decoder: $((Get-Command ffprobe -ErrorAction Stop).Source)"
          ./scripts/Test-UERenderArtifacts.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UERenderArtifacts.ps1 exited $LASTEXITCODE" }

  capture-encode:
    name: capture preset encode contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      # The suite builds its own fixtures with ffmpeg and measures them with ffprobe. Without
      # those tools it reports UNVERIFIED and exits 2 instead of passing, so they are provided
      # here rather than left to whatever the runner happens to ship.
      - name: Provide ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { return }
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install ffmpeg exited $LASTEXITCODE" }

      - name: ffmpeg and ffprobe version
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Test-UECaptureEncode.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UECaptureEncode.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UECaptureEncode.ps1 exited $LASTEXITCODE" }

