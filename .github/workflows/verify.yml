name: verify

# The repository historically shipped no CI, so every pull request reached the
# merge gate with zero successful checks. The managed delivery lane reads
# "no successful check" as a repairable defect and opens a repair issue per PR,
# which cannot fix a repository-wide gap: the repair burns, the PR waits, and the
# next PR conflicts with it. This workflow is the missing check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: scaffold generator
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The generator records the template commit and refuses a dirty tree.
          # The suite builds its own fixtures and clones itself from this checkout.
          fetch-depth: 1

      - name: Test-UETemplateScaffold.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UETemplateScaffold.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UETemplateScaffold.ps1 exited $LASTEXITCODE" }

  capture-encode:
    name: capture preset encode contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      # The suite builds its own fixtures with ffmpeg and measures them with ffprobe. Without
      # those tools it reports UNVERIFIED and exits 2 instead of passing, so they are provided
      # here rather than left to whatever the runner happens to ship.
      - name: Provide ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { return }
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install ffmpeg exited $LASTEXITCODE" }

      - name: ffmpeg and ffprobe version
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Test-UECaptureEncode.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UECaptureEncode.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UECaptureEncode.ps1 exited $LASTEXITCODE" }

  render-artifacts:
    name: render artifact inspection
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      # The clean-sequence case asserts decode=pass, which needs a real decoder.
      # Without one the inspector correctly reports decode=unverified and exits 2,
      # so the suite is capability-dependent, not runner-independent. Provision
      # the same decoder the documented QA baseline uses instead of weakening the
      # assertion to "whatever this host happens to have".
      - name: Provide ffprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command ffprobe -ErrorAction SilentlyContinue) { return }
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install ffmpeg exited $LASTEXITCODE" }

      - name: ffprobe version
        shell: pwsh
        run: ffprobe -version

      - name: Test-UERenderArtifacts.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "decoder: $((Get-Command ffprobe -ErrorAction Stop).Source)"
          ./scripts/Test-UERenderArtifacts.ps1
          if ($LASTEXITCODE -ne 0) { throw "Test-UERenderArtifacts.ps1 exited $LASTEXITCODE" }
